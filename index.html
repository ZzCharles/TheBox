<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0B0D12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      iOS reads NONE of the web app manifest's icons — apple-touch-icon is the
      only one it will use, so this link is not a duplicate of the manifest.
      vite-plugin-pwa injects the manifest link itself.
    -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!--
      font-display:block means text stays invisible until Archivo arrives, so
      fetch it in parallel with the module graph rather than waiting for the CSS.
    -->
    <link rel="preload" href="/fonts/Archivo.woff2" as="font" type="font/woff2" crossorigin />
    <title>Tiki</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
